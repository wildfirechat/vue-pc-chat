          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # Office 技能默认解释器（随安装包内置的 Python）；没有 payload 时禁用。
          - id: workspace-dependencies
            name: '@deepseek-ai/dsh-tool-workspace-dependencies'
            disabled: !!js "!process.env.DSH_PRIMARY_RUNTIME && !process.env.DSH_BUNDLED_PRIMARY_RUNTIME"
            config:
              source: !!js "process.getBuiltinModule('node:path').resolve(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME ?? '')"
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
# <<< wildfire preset mode

# ── Office（必选，随安装包内置 LibreOffice + Python；由 prepare-office-runtime 准备）──
- insert:
    # Office → PDF 转换服务（LibreOffice kit）
    - id: office-to-pdf
      name: '@deepseek-ai/dsh-office-to-pdf'
    # Word/PPT/Excel 技能（office-docx / office-pptx / office-xlsx）
    - id: skill-office
      name: '@deepseek-ai/dsh-skill-office'
      disabled: !!js "!process.env.DSH_PRIMARY_RUNTIME && !process.env.DSH_BUNDLED_PRIMARY_RUNTIME"
      config:
        assetRoot: !!js "process.getBuiltinModule('node:path').resolve(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME ?? '', '..', 'office-skills')"
        node: !!js "process.execPath"

# ── 会话历史全文检索（SQLite FTS5；openAt: first-search，首次检索才加载 sqlite）──
# 覆盖 dsh-base 的 path: ':memory:' / openAt: never；索引落在 DSH home，重启后仍可检索。
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-search.db')
    openAt: first-search

